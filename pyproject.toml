[project]
name = "giongtoi"
version = "0.1.0"
description = "GiọngTôi - clone giọng nói của bạn, đọc văn bản tiếng Việt, chạy offline trên macOS"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "vieneu>=3.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "numpy",
    "soundfile",
    "soxr",
    "librosa>=0.11",
    "mutagen>=1.47",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# Ứng viên thứ hai cho thử nghiệm so sánh mô hình (cần PyTorch, nặng hơn)
f5 = ["f5-tts>=1.1", "torch", "torchaudio"]
# Gói thành cửa sổ ứng dụng macOS
app = ["pywebview>=5.0"]

[project.scripts]
giongtoi = "giongtoi.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/giongtoi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
